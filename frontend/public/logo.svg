<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140" role="img" aria-label="VandiMart logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>VandiMart</title>
  <!-- Circle badge -->
  <circle cx="70" cy="70" r="60" fill="#1e40af"/>
  <circle cx="70" cy="70" r="52" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <!-- V monogram: left stroke white, right stroke is an amber checkmark -->
  <path d="M38 48 L64 98" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <path d="M64 98 L106 38" fill="none" stroke="#f59e0b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small wheel dots -->
  <circle cx="36" cy="106" r="5" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="104" cy="106" r="5" fill="#ffffff" fill-opacity="0.5"/>

  <!-- Wordmark -->
  <text x="150" y="82" font-family="'Poppins','Segoe UI',Helvetica,Arial,sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5" fill="#1e40af">vandi<tspan fill="#0f172a">mart</tspan></text>
  <rect x="153" y="96" width="36" height="4" rx="2" fill="#f59e0b"/>
  <text x="153" y="122" font-family="'Poppins','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="3.5" fill="#64748b">BUY · SELL · DRIVE</text>
</svg>
