name: Backend CI

on:
  push:
    branches:
      - master
      - develop
      - staging

  pull_request:
    branches:
      - master
      - develop
      - staging

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      # Comenting this now, because dont have any unit test now, will add later
