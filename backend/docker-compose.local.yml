services:
  backend:
    build:
      context: .
    ports:
      - "5000:5000"
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: used_car
    ports:
      - "5434:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d used_car"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_local_data:
